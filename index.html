<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐网站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container">
            <div class="logo">周泽弘'Music</div>
            <nav class="nav">
                <ul>
                    <li><a href="#" class="active">首页</a></li>
                    <li><a href="#">歌手</a></li>
                    <li><a href="#">专辑</a></li>
                    <li><a href="#">排行榜</a></li>
                    <li><a href="#">分类</a></li>
                </ul>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="搜索音乐、歌手...">
                <button>搜索</button>
            </div>
        </div>
    </header>
    
    <!-- 主要内容区域 -->
    <main class="main">
        <div class="container">
            <!-- 轮播图/横幅 -->
            <section class="banner">
                <h2>热门专辑推荐</h2>
                <div class="banner-content">
                    <div class="banner-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/OIP-C.webp" alt="推荐专辑">
                        <p>SOS</p>
                    </div>
                    <div class="banner-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/OIP-C%20%281%29.webp" alt="推荐专辑">
                        <p>Ctrl</p>
                    </div>
                    <div class="banner-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/1200x1200bf-60.jpg" alt="推荐专辑">
                        <p>Lana</p>
                    </div>
                </div>
            </section>

            <!-- 歌手推荐 -->
            <section class="singers">
                <h2>热门top歌手</h2>
                <div class="singer-list">
                    <div class="singer-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/OIP-C.jpg" alt="歌手">
                        <p>SZA</p>
                    </div>
                    <div class="singer-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/v2-323909e666640827dcdc02afb559eef7_r.jpg" alt="歌手">
                        <p>Billie</p>
                    </div>
                    <div class="singer-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/%E4%B8%8B%E8%BD%BD.webp" alt="歌手">
                        <p>Kendrick</p>
                    </div>
                    <div class="singer-item">
                        <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/OIP-C%20%282%29.webp" alt="歌手">
                        <p>Drake</p>
                    </div>
                </div>
            </section>

            <!-- 排行榜 -->
            <section class="rankings">
                <h2>音乐排行榜</h2>
                <div class="ranking-list">
                    <div class="ranking-item">
                        <span class="rank-num">1</span>
                        <div class="song-info">
                            <h4>Open arms</h4>
                            <p>SZA</p>
                        </div>
                    </div>
                    <div class="ranking-item">
                        <span class="rank-num">2</span>
                        <div class="song-info">
                            <h4>kiss me more</h4>
                            <p>SZA</p>
                        </div>
                    </div>
                    <div class="ranking-item">
                        <span class="rank-num">3</span>
                        <div class="song-info">
                            <h4>Snooze</h4>
                            <p>SZA</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 播放器 -->
    <footer class="player">
        <div class="container">
            <div class="player-info">
                <img src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/OIP-C.webp" alt="专辑封面">
                <div>
                    <h4>Snooze</h4>
                    <p>SZA</p>
                </div>
            </div>
            <div class="player-controls">
                <button id="lyrics-btn">歌词</button>
                <button id="prev-btn">上一首</button>
                <button id="play-btn">播放/暂停</button>
                <button id="next-btn">下一首</button>
                 <!-- 音量控制 -->
                <div class="volume-control">
                    <span class="volume-icon">🔊</span>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
                </div>
            </div>
            <div class="player-progress">
                <span id="current-time">00:00</span>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="duration">00:00</span>
            </div>
        </div>
    </footer>

    <!-- 弹出歌词框 -->
    <div id="lyrics-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>歌词</h2>
            <div class="lyrics-container" id="lyrics-container">
                <div class="lyrics-placeholder">播放音乐以查看歌词</div>
            </div>
        </div>
    </div>

    <!-- 引入 JavaScript 文件 -->
    <script src="script.js"></script>

    <audio id="audio-player" src="https://java-web-zzh.oss-cn-beijing.aliyuncs.com/snooze1.mp3"></audio>
</body>
</html>
